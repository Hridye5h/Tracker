# Render Blueprint — deploy in a few clicks:
#   Render Dashboard -> New -> Blueprint -> connect this repo -> Apply.
# Express serves the built React client in production, so this is ONE service.
# You will be prompted for MONGO_URI (sync:false); JWT_SECRET is auto-generated.
services:
  - type: web
    name: expense-tracker
    runtime: node
    plan: free
    branch: master
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: "30d"
      - key: MONGO_URI
        sync: false
